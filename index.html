<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">

<title>ZOTH</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: #080808;
    color: #f2f2f2;
    font-family: 'Space Grotesk', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

/* GRID DISCRETO */

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
    background-size: 70px 70px;
    mask-image: radial-gradient(ellipse, black, transparent 75%);
}

/* CONTEÚDO CENTRAL */

main {
    text-align: center;
    animation: appear 1.5s ease both;
    z-index: 1;
}

h1 {
    font-size: clamp(65px, 13vw, 130px);
    font-weight: 600;
    letter-spacing: .28em;
    padding-left: .28em;
    line-height: 1;
}

h1 span {
    color: #d71920;
}

.line {
    width: 35px;
    height: 2px;
    background: #d71920;
    margin: 35px auto 25px;
}

p {
    color: #777;
    font-size: 11px;
    letter-spacing: .18em;
    text-transform: uppercase;
}

/* MÚSICA */

.music-toggle {
    position: fixed;
    bottom: 30px;
    right: 30px;
    z-index: 5;

    background: transparent;
    border: 1px solid #292929;
    color: #888;

    padding: 12px 16px;
    font-size: 10px;
    letter-spacing: .15em;

    cursor: pointer;
    transition: .3s;
}

.music-toggle:hover,
.music-toggle.playing {
    border-color: #d71920;
    color: #f2f2f2;
}

.music-toggle span {
    color: #d71920;
    margin-right: 8px;
}

/* ANIMAÇÃO */

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(15px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media(max-width: 500px) {
    h1 {
        font-size: 58px;
        letter-spacing: .2em;
        padding-left: .2em;
    }

    .music-toggle {
        bottom: 20px;
        right: 20px;
    }
}

@media(prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation: none !important;
        transition: none !important;
    }
}
</style>
</head>

<body>

<audio id="music" loop preload="none">
    <source src="background.mp3" type="audio/mpeg">
</audio>

<main>
    <h1>ZOTH<span>.</span></h1>

    <div class="line"></div>

    <p>Nothing to prove.</p>
</main>

<button class="music-toggle" id="musicButton">
    <span>▶</span> MUSIC
</button>

<script>
const music = document.getElementById("music");
const button = document.getElementById("musicButton");

music.volume = 0.2;

button.addEventListener("click", async () => {
    if (music.paused) {
        try {
            await music.play();
            button.innerHTML = "<span>Ⅱ</span> PAUSE";
            button.classList.add("playing");
        } catch (error) {
            button.innerHTML = "<span>!</span> ERROR";
        }
    } else {
        music.pause();
        button.innerHTML = "<span>▶</span> MUSIC";
        button.classList.remove("playing");
    }
});

music.addEventListener("pause", () => {
    button.innerHTML = "<span>▶</span> MUSIC";
    button.classList.remove("playing");
});
</script>

</body>
</html>
