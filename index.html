<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ZOTH</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            background: #080808;
            color: #f2f2f2;
            font-family: 'Space Grotesk', sans-serif;
            overflow-x: hidden;
            opacity: 0;
            animation: pageEnter 1s ease forwards;
        }

        /* Grade de fundo */

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
            background-size: 55px 55px;
            pointer-events: none;
            z-index: -1;
        }

        /* Menu */

        nav {
            position: absolute;
            top: 35px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 35px;
            z-index: 10;
        }

        nav a {
            color: #777;
            text-decoration: none;
            font-size: 13px;
            letter-spacing: 1px;
            transition: color .3s;
        }

        nav a:hover {
            color: #d71920;
        }

        /* Início */

        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 100px 20px;
        }

        .hero h1 {
            font-size: clamp(65px, 12vw, 130px);
            font-weight: 600;
            letter-spacing: .28em;
            padding-left: .28em;
            opacity: 0;
            animation: titleEnter 1.3s cubic-bezier(.16, 1, .3, 1) .3s forwards;
        }

        .hero h1 span {
            color: #d71920;
        }

        .hero p {
            margin-top: 18px;
            color: #777;
            font-size: 12px;
            letter-spacing: 4px;
            opacity: 0;
            animation: fadeUp 1s ease 1s forwards;
        }

        .line {
            width: 35px;
            height: 2px;
            background: #d71920;
            margin-top: 35px;
            transform: scaleX(0);
            animation: lineEnter .7s ease 1.2s forwards;
        }

        /* Sobre */

        .about {
            min-height: 65vh;
            padding: 100px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            border-top: 1px solid #181818;
        }

        .about h2 {
            color: #d71920;
            font-size: 13px;
            letter-spacing: 4px;
            font-weight: 500;
            margin-bottom: 25px;
        }

        .about p {
            max-width: 500px;
            color: #777;
            font-size: 14px;
            line-height: 2;
        }

        /* Rodapé */

        footer {
            padding: 25px;
            text-align: center;
            color: #444;
            font-size: 11px;
            letter-spacing: 2px;
        }

        /* Música */

        #musicButton {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: transparent;
            border: 1px solid #333;
            color: #888;
            padding: 10px 15px;
            font-family: inherit;
            font-size: 11px;
            letter-spacing: 1px;
            cursor: pointer;
            transition: .3s;
            z-index: 20;
        }

        #musicButton:hover {
            border-color: #d71920;
            color: #fff;
        }

        /* Animações */

        @keyframes pageEnter {
            to {
                opacity: 1;
            }
        }

        @keyframes titleEnter {
            from {
                opacity: 0;
                transform: translateY(35px);
                filter: blur(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes lineEnter {
            to {
                transform: scaleX(1);
            }
        }

        /* Acessibilidade */

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: .01ms !important;
                animation-delay: 0ms !important;
                scroll-behavior: auto !important;
            }

            body,
            .hero h1,
            .hero p {
                opacity: 1;
            }

            .line {
                transform: scaleX(1);
            }
        }

        @media (max-width: 480px) {
            nav {
                gap: 20px;
                top: 25px;
            }

            nav a {
                font-size: 11px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <a href="projetos.html">Projetos</a>
        <a href="blog.html">Blog</a>
        <a href="aulas.html">Aulas</a>
    </nav>

    <main>

        <section class="hero">
            <h1>ZOTH<span>.</span></h1>

            <p>NOTHING TO PROVE.</p>

            <div class="line"></div>
        </section>

        <section class="about" id="sobre">
            <h2>Sobre:</h2>

            <p>
                <!-- Escreva aqui a explicação sobre o site. -->
            </p>
        </section>

    </main>

    <footer>
        ZOTH © 2026
    </footer>

    <audio id="backgroundMusic" loop preload="auto">
        <source src="background.mp3" type="audio/mpeg">
    </audio>

    <button id="musicButton" aria-label="Ativar música">
        ♪ MUSIC OFF
    </button>

    <script>
        const music = document.getElementById("backgroundMusic");
        const musicButton = document.getElementById("musicButton");

        let musicPlaying = false;

        music.volume = 0.2;

        async function startMusic() {
            try {
                await music.play();
                musicPlaying = true;
                updateMusicButton();
            } catch (error) {
                musicPlaying = false;
                updateMusicButton();
            }
        }

        function updateMusicButton() {
            musicButton.textContent = musicPlaying
                ? "♪ MUSIC ON"
                : "♪ MUSIC OFF";

            musicButton.setAttribute(
                "aria-label",
                musicPlaying ? "Desativar música" : "Ativar música"
            );
        }

        musicButton.addEventListener("click", async (event) => {
            event.stopPropagation();

            if (musicPlaying) {
                music.pause();
                musicPlaying = false;
                updateMusicButton();
            } else {
                await startMusic();
            }
        });

        // Tentativa de reprodução automática
        window.addEventListener("load", startMusic);

        // Se o navegador bloquear, tenta após a primeira interação
        async function firstInteraction() {
            if (!musicPlaying) {
                await startMusic();
            }

            if (musicPlaying) {
                document.removeEventListener("click", firstInteraction);
                document.removeEventListener("keydown", firstInteraction);
            }
        }

        document.addEventListener("click", firstInteraction);
        document.addEventListener("keydown", firstInteraction);
    </script>

</body>
</html>
