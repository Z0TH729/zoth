    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root{--bg:#0b0b0b;--surface:#171717;--text:#f2f2f2;--muted:#999;--accent:#CE422B;--border:#292929}
        *{margin:0;padding:0;box-sizing:border-box}html{scroll-behavior:smooth}body{min-height:100vh;background:var(--bg);color:var(--text);font-family:'Space Grotesk',sans-serif;overflow-x:hidden;opacity:0;animation:pageIn .7s ease forwards}
        body::before{content:"";position:fixed;inset:0;background-image:linear-gradient(#ffffff06 1px,transparent 1px),linear-gradient(90deg,#ffffff06 1px,transparent 1px);background-size:45px 45px;pointer-events:none;z-index:-1}
        a{color:inherit;text-decoration:none}.container{width:min(100% - 40px,1000px);margin:auto}header{width:min(1100px,calc(100% - 40px));height:76px;margin:auto;border-bottom:1px solid var(--border);padding:0}nav{display:flex;justify-content:space-between;align-items:center}
        .back{color:var(--muted);font-size:12px}.back:hover{color:var(--accent)}.brand{color:#f2f2f2;font-size:21px;font-weight:700;letter-spacing:5px}main{padding:55px 0 90px}
        .label{color:var(--accent);font-size:12px;letter-spacing:4px;margin-bottom:20px}.heading{display:flex;align-items:center;gap:16px}.crab{font-size:48px;filter:drop-shadow(0 0 12px #CE422B55)}
        h1{font-size:clamp(38px,8vw,65px);letter-spacing:-3px}h1 span,.topic h2 span{color:var(--accent)}.description{color:var(--muted);font-size:15px;line-height:1.8;margin-top:20px;max-width:600px}
        .content{margin-top:45px}.topic{padding:26px;margin:0 0 16px;border:1px solid var(--border);border-radius:12px;background:linear-gradient(145deg,#141414,#0e0e0e);transition:border-color .3s,transform .3s}.topic:hover{border-color:#71302a;transform:translateY(-2px)}.topic h2{font-size:21px;margin-bottom:17px}.topic p{color:#b5b5b5;font-size:15px;line-height:1.9;margin-bottom:12px}
        .terminal{margin:24px 0;background:#080808;border:1px solid #333;border-radius:8px;overflow:hidden;box-shadow:0 8px 30px #0008}.terminal-header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:#1b1b1b;border-bottom:1px solid #333}
        .terminal-dots{display:flex;gap:7px}.terminal-dots span{width:10px;height:10px;border-radius:50%;background:#555}.terminal-dots span:nth-child(1){background:#CE422B}.terminal-dots span:nth-child(2){background:#d69b35}.terminal-dots span:nth-child(3){background:#5b9c65}
        .terminal-name{color:#888;font-size:11px;letter-spacing:1px}.terminal-copy{background:transparent;border:1px solid #444;color:#aaa;padding:5px 9px;font-size:11px;cursor:pointer;border-radius:4px}.terminal-copy:hover{color:var(--accent);border-color:var(--accent)}
        .terminal-body{padding:22px;overflow-x:auto}.terminal-body pre{color:#ddd;font-family:monospace;font-size:13px;line-height:1.9;white-space:pre}.prompt{color:var(--accent);font-weight:bold}.output{color:#999}
        .note{background:#17110f;border:1px solid #762D1C55;padding:20px;margin-top:20px;color:#b5b5b5;line-height:1.8}.highlight{color:var(--accent)}
        .navigation{display:flex;justify-content:space-between;gap:20px;margin-top:70px;padding-top:25px;border-top:1px solid var(--border)}.navigation a{color:var(--accent);font-size:13px}.navigation a:hover{color:#f26a50}
        footer{border-top:1px solid var(--border);padding:30px 0;text-align:center;color:#666;font-size:12px;letter-spacing:2px}@keyframes pageIn{to{opacity:1}}
        @media(max-width:650px){.container{width:calc(100% - 30px)}header.topbar{width:calc(100% - 30px);height:auto;min-height:70px;padding:20px 0 14px;display:flex;align-items:flex-start;flex-direction:column;gap:16px}header nav{width:100%;justify-content:space-between;gap:10px}main{padding:45px 0 65px}.navigation{flex-direction:column}.terminal-body{padding:16px}.terminal-body pre{font-size:12px}.terminal-header{padding:10px}}
        @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}body{opacity:1}}
    </style>
</head>

    <script>
        function copiarTerminal(botao){
            const terminal=botao.closest('.terminal').querySelector('pre');
            const texto=terminal.innerText.split('\n').filter(linha=>linha.includes('$ ')).map(linha=>linha.substring(linha.indexOf('$ ')+2)).join('\n');
            navigator.clipboard.writeText(texto).then(()=>{botao.textContent='COPIADO';setTimeout(()=>botao.textContent='COPIAR',1500)}).catch(()=>{botao.textContent='ERRO';setTimeout(()=>botao.textContent='COPIAR',1500)});
        }
    </script>
</body>
