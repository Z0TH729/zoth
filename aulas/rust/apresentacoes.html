<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0b0b">
<title>Apresentações | Rust - ZOTH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0b;--text:#f2f2f2;--muted:#777;--accent:#CE422B;--border:#292929}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font-family:'Space Grotesk',sans-serif;overflow-x:hidden;opacity:0;animation:pageIn .7s ease forwards}
body::before{content:"";position:fixed;inset:0;background-image:linear-gradient(#ffffff06 1px,transparent 1px),linear-gradient(90deg,#ffffff06 1px,transparent 1px);background-size:45px 45px;pointer-events:none;z-index:-1}
a{color:inherit;text-decoration:none}
.topbar{width:min(1100px,calc(100% - 40px));min-height:76px;margin:0 auto;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:24px}
.brand{color:#f2f2f2;font-size:21px;font-weight:700;letter-spacing:5px}
nav{display:flex;align-items:center;gap:25px}
nav a{color:#777;font-size:12px;transition:color .25s}
nav a:hover,nav a.active{color:#f2f2f2}
nav a.active::after{content:"";display:block;width:100%;height:2px;margin-top:7px;background:var(--accent)}
main{width:min(1000px,calc(100% - 40px));flex:1;min-height:400px;margin:0 auto;display:grid;place-items:center}
.empty-state{display:flex;flex-direction:column;align-items:center;gap:22px}
.empty-message{color:#777;font-size:clamp(16px,3vw,20px);font-weight:400;text-align:center}
.loading-spinner{width:28px;height:28px;border:3px solid #ffffff18;border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
footer{border-top:1px solid var(--border);padding:30px 20px;text-align:center;color:#666;font:10px 'Fira Code',monospace;letter-spacing:2px}
@keyframes pageIn{to{opacity:1}}
@media(max-width:650px){.topbar{width:calc(100% - 30px);padding:18px 0;align-items:flex-start;flex-direction:column;gap:16px}nav{width:100%;justify-content:space-between;gap:8px;flex-wrap:wrap}nav a{font-size:10px}main{width:calc(100% - 30px);min-height:350px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}.loading-spinner{animation:none}body{opacity:1}}
</style>
</head>
<body>
<header class="topbar">
<a class="brand" href="../../index.html">ZOTH<span style="color:#d71920">.</span></a>
<nav aria-label="Navegação principal">
<a href="../../index.html">Início</a>
<a href="../../projetos.html">Projetos</a>
<a href="../../apoiadores.html">Apoiadores</a>
<a href="../../blog.html">Blog</a>
<a href="../../rsz.html">RSZ</a>
<a href="../../aulas.html" class="active">Aulas</a>
</nav>
</header>
<main>
<div class="empty-state">
<p class="empty-message">Ainda não há nada aqui...</p>
<div class="loading-spinner" role="status" aria-label="Carregando"></div>
</div>
</main>
<footer>ZOTH © 2026</footer>
</body>
</html>
